name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests & build APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swara-debug-apk
          path: apps/android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android-native/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
