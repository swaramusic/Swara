name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests & build Debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swara-debug-apk
          path: apps/android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Release Keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > swara-release.jks

      - name: Build Signed Release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SWARA_KEYSTORE_PATH: ${{ github.workspace }}/apps/android-native/swara-release.jks
          SWARA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SWARA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SWARA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/android-native/app/build/outputs/apk/debug/app-debug.apk
            apps/android-native/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
