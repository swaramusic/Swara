name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests & build APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: swara-debug-apk
          path: apps/android-native/app/build/outputs/apk/debug/app-debug.apk
