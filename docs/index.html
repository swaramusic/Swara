<body class="bg-[#0B0F17] text-[#F2F5FA] antialiased selection:bg-[#2563EB] selection:text-white overflow-x-hidden">
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const h = React.createElement;
    // Google Apps Script Web App URL for real-time Google Sheets suggestions:
    const FEEDBACK_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwahzc6YpBUs3YYKD-Bif2Iw0I_mcEsJzU1_Qo3qYolIUAeJ58ivUQB2K6tHWo6Motr/exec';
    const RELEASES_URL = 'https://github.com/swaramusic/Swara/releases';

    function Headphone3D() {
      const mountRef = useRef(null);
      const [webglError, setWebglError] = useState(false);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        let renderer, controls, raf = 0, observer;
        try {
          const width = Math.max(260, container.clientWidth || 320);
          const height = Math.max(260, container.clientHeight || 340);

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
          camera.position.set(0, 0.35, 5.1);

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(width, height);
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          controls = new OrbitControls(camera, renderer.domElement);
          controls.enableZoom = false;
          controls.enablePan = false;
          controls.enableDamping = true;
          controls.dampingFactor = 0.06;
          controls.autoRotate = true;
          controls.autoRotateSpeed = 1.7;

          scene.add(new THREE.AmbientLight(0xffffff, 1.05));
          const keyLight = new THREE.DirectionalLight(0x60a5fa, 2.6);
          keyLight.position.set(4, 5, 5);
          scene.add(keyLight);
          const rimLight = new THREE.DirectionalLight(0x1c9b90, 2.2);
          rimLight.position.set(-5, -2, -3);
          scene.add(rimLight);
          const topGlow = new THREE.PointLight(0x3b82f6, 1.4, 10);
          topGlow.position.set(0, 2.5, 2);
          scene.add(topGlow);

          const hp = new THREE.Group();
          const matteDark = new THREE.MeshStandardMaterial({ color: 0x172036, roughness: 0.32, metalness: 0.68 });
          const cushionMat = new THREE.MeshStandardMaterial({ color: 0x0f1523, roughness: 0.85, metalness: 0.12 });
          const accentMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.22, metalness: 0.8, emissive: 0x1d4ed8, emissiveIntensity: 0.45 });
          const metalMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.18, metalness: 0.92 });

          const band = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.11, 24, 64, Math.PI * 1.06), matteDark);
          band.rotation.z = -Math.PI * 0.03;
          band.position.y = 0.28;
          hp.add(band);

          const pad = new THREE.Mesh(new THREE.TorusGeometry(1.23, 0.075, 16, 48, Math.PI * 0.72), cushionMat);
          pad.rotation.z = Math.PI * 0.14;
          pad.position.y = 0.28;
          hp.add(pad);

          [-1, 1].forEach((side) => {
            const cupGroup = new THREE.Group();
            cupGroup.position.set(side * 1.38, -0.35, 0);
            cupGroup.rotation.z = side * -0.14;

            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.62, 16), metalMat);
            stem.position.set(side * 0.04, 0.45, 0);
            cupGroup.add(stem);

            const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.62, 0.34, 36), matteDark);
            shell.rotation.z = Math.PI / 2;
            cupGroup.add(shell);

            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.035, 16, 48), accentMat);
            ring.rotation.y = Math.PI / 2;
            ring.position.x = side * 0.18;
            cupGroup.add(ring);

            const cushion = new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.17, 20, 48), cushionMat);
            cushion.rotation.y = Math.PI / 2;
            cushion.position.x = -side * 0.22;
            cupGroup.add(cushion);

            hp.add(cupGroup);
          });

          hp.rotation.x = 0.16;
          hp.rotation.y = -0.35;
          scene.add(hp);

          const clock = new THREE.Clock();
          const animate = () => {
            raf = requestAnimationFrame(animate);
            hp.position.y = Math.sin(clock.getElapsedTime() * 1.6) * 0.09;
            controls.update();
            renderer.render(scene, camera);
          };
          animate();

          const handleResize = () => {
            if (!container || !renderer) return;
            const w = Math.max(240, container.clientWidth);
            const hPx = Math.max(240, container.clientHeight);
            camera.aspect = w / hPx;
            camera.updateProjectionMatrix();
            renderer.setSize(w, hPx);
          };
          observer = new ResizeObserver(handleResize);
          observer.observe(container);
          window.addEventListener('resize', handleResize);

          return () => {
            cancelAnimationFrame(raf);
            window.removeEventListener('resize', handleResize);
            if (observer) observer.disconnect();
            controls.dispose();
            renderer.dispose();
          };
        } catch (err) {
          console.error('3D init error:', err);
          setWebglError(true);
        }
      }, []);

      if (webglError) {
        return h('div', { className: 'w-full h-[280px] sm:h-[360px] md:h-[420px] flex items-center justify-center' },
          h('div', { className: 'w-44 h-44 rounded-full bg-gradient-to-br from-[#2563EB]/30 to-[#1C9B90]/20 border border-white/10 flex items-center justify-center text-5xl shadow-2xl' }, '🎧')
        );
      }

      return h('div', {
        ref: mountRef,
        style: { minHeight: '280px' },
        className: 'w-full h-[290px] sm:h-[360px] md:h-[430px] cursor-grab active:cursor-grabbing select-none',
      });
    }

    const CONTRIBUTORS = [
      {
        id: 'tirtadhi',
        name: 'tirtadhi',
        role: 'Creator & Lead Developer',
        avatar: 'https://github.com/tirtadhi.png',
        github: 'https://github.com/tirtadhi',
        qr: './qris-qr.png',
      },
    ];

    function App() {
      const [release, setRelease] = useState({ tag: 'v1.0.0', url: RELEASES_URL, label: 'Download APK', hasDirectApk: false });
      const [showSupport, setShowSupport] = useState(false);
      const [selectedSupporter, setSelectedSupporter] = useState(null);
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [openFaq, setOpenFaq] = useState(0);
      const [fbContact, setFbContact] = useState('');
      const [fbMsg, setFbMsg] = useState('');
      const [fbStatus, setFbStatus] = useState({ type: '', text: '' });
      const [sending, setSending] = useState(false);

      useEffect(() => {
        fetch('https://api.github.com/repos/swaramusic/Swara/releases/latest')
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => {
            if (!d) return;
            const apk = (d.assets || []).find((a) => a.name && a.name.endsWith('.apk'));
            setRelease({
              tag: d.tag_name || 'v1.0.0',
              url: apk?.browser_download_url || d.html_url || RELEASES_URL,
              label: apk?.name ? `Download APK (${d.tag_name || 'Latest'})` : 'Download APK',
              hasDirectApk: Boolean(apk?.browser_download_url),
            });
          })
          .catch(() => {});
      }, []);

      async function submitSuggestion(e) {
        e.preventDefault();
        if (!fbMsg.trim() || sending) return;
        if (!FEEDBACK_SCRIPT_URL) {
          const title = encodeURIComponent('[Swara] Suggestion');
          const body = encodeURIComponent(`From: ${fbContact || 'Anonymous'}\n\n${fbMsg}`);
          window.open(`https://github.com/swaramusic/Swara/issues/new?title=${title}&body=${body}`, '_blank', 'noopener,noreferrer');
          setFbStatus({ type: 'info', text: 'Opening GitHub to submit your suggestion...' });
          return;
        }
        setSending(true);
        setFbStatus({ type: 'info', text: 'Sending...' });
        try {
          await fetch(FEEDBACK_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'Suggestion', contact: fbContact, message: fbMsg, time: new Date().toISOString() }),
          });
          setFbStatus({ type: 'success', text: 'Thank you! Your suggestion has been received.' });
          setFbMsg('');
          setFbContact('');
        } catch {
          setFbStatus({ type: 'error', text: 'Failed to send. Please try again.' });
        } finally {
          setSending(false);
        }
      }

      return h(
        'div',
        { className: 'min-h-screen flex flex-col justify-between bg-[radial-gradient(circle_at_70%_20%,rgba(37,99,235,0.24),transparent_48%),radial-gradient(circle_at_20%_80%,rgba(28,155,144,0.18),transparent_45%)]' },
        [
          h('header', { key: 'nav', className: 'max-w-6xl w-full mx-auto px-4 sm:px-6 py-5 flex items-center justify-between gap-4' }, [
            h('a', { href: '#top', className: 'flex items-center gap-2.5' }, [
              h('img', { src: './logo.png', alt: 'Swara Logo', className: 'w-8 h-8 rounded-lg object-contain bg-white' }),
              h('span', { className: 'font-extrabold tracking-[0.22em] text-base sm:text-lg' }, 'SWARA'),
            ]),
            h('nav', { className: 'flex items-center gap-4 sm:gap-6 text-xs sm:text-sm text-white/75' }, [
              h('a', { href: '#features', className: 'hidden sm:inline hover:text-white transition' }, 'Features'),
              h('a', { href: '#faq', className: 'hidden sm:inline hover:text-white transition' }, 'FAQ'),
              h('button', { onClick: () => setShowSuggestions(true), className: 'hover:text-white transition cursor-pointer' }, 'Suggestions'),
              h('button', { onClick: () => setShowSupport(true), className: 'hover:text-white transition cursor-pointer' }, 'Support'),
              h('a', { href: 'https://github.com/swaramusic/Swara', target: '_blank', rel: 'noopener noreferrer', className: 'hover:text-white transition' }, 'GitHub'),
            ]),
          ]),

          h('main', { key: 'main', className: 'max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-10 grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 items-center my-auto' }, [
            h('div', { className: 'space-y-5 text-center md:text-left order-2 md:order-1' }, [
              h('h1', { className: 'text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight' }, 'Swara'),
              h('p', { className: 'text-white/70 text-sm sm:text-base max-w-md mx-auto md:mx-0 leading-relaxed' }, 'Fast & Fluid Music Player.'),
              h('div', { className: 'flex flex-col sm:flex-row items-stretch sm:items-center justify-center md:justify-start gap-3 pt-2' }, [
                h('a', {
                  href: release.url,
                  ...(release.hasDirectApk ? { download: '' } : { target: '_blank', rel: 'noopener noreferrer' }),
                  className: 'px-6 py-3.5 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] font-bold text-sm text-white transition shadow-lg shadow-[#2563EB]/30 text-center',
                }, release.label),
                h('button', {
                  onClick: () => setShowSupport(true),
                  className: 'px-6 py-3.5 rounded-full bg-white/10 hover:bg-white/15 border border-white/15 font-semibold text-sm transition cursor-pointer text-center',
                }, 'Support'),
                h('button', {
                  onClick: () => setShowSuggestions(true),
                  className: 'px-6 py-3.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 font-semibold text-sm text-white/85 transition cursor-pointer text-center',
                }, 'Suggestions'),
              ]),
            ]),
            h('div', { key: '3dwrap', className: 'order-1 md:order-2 w-full' }, h(Headphone3D)),
          ]),

          h('section', { key: 'features', id: 'features', className: 'max-w-6xl w-full mx-auto px-4 sm:px-6 py-10 space-y-6' }, [
            h('div', { className: 'space-y-1 text-center md:text-left' }, [
              h('h2', { className: 'text-2xl sm:text-3xl font-bold' }, 'Why Swara?'),
              h('p', { className: 'text-sm text-white/60' }, 'Built in pure Kotlin & Jetpack Compose for zero-bloat speed.'),
            ]),
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4' }, [
              ['Native Media3 Engine', 'Smooth background playback, lock-screen controls, and Bluetooth support with zero WebView overhead.'],
              ['Dynamic Island & Vinyl', 'Floating miniplayer pill with animated progress bar, clean square cover art, and tap-to-spin Vinyl mode.'],
              ['Equalizer & Sound Styles', '5-band native equalizer, Bass Boost, Room Reverb, Speed/Pitch, Nightcore, Lo-fi, and 8D profiles.'],
              ['Offline & Local Audio', 'Download songs for offline listening, manage song cache size, or import local FLAC, MP3, and WAV files.'],
              ['Synced Lyrics & Stats', 'Time-synced lyrics, listening streaks, top charts by region, and shareable Story Recap cards.'],
              ['Open Source & Ad-Free', '100% free under GPL-3.0, zero ads, zero trackers, and HTTPS-only network security.'],
            ].map(([title, desc]) =>
              h('div', { key: title, className: 'p-5 rounded-2xl bg-white/[0.04] border border-white/10 space-y-1.5' }, [
                h('h3', { className: 'font-bold text-sm sm:text-base text-white' }, title),
                h('p', { className: 'text-xs sm:text-sm text-white/65 leading-relaxed' }, desc),
              ])
            )),
          ]),

          h('section', { key: 'faq', id: 'faq', className: 'max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 space-y-5' }, [
            h('h2', { className: 'text-2xl sm:text-3xl font-bold text-center md:text-left' }, 'Quick Guide & FAQ'),
            h('div', { className: 'space-y-3' }, [
              ['How do I install Swara on Android?', 'Tap Download APK above, open the downloaded .apk file on Android 8.0+, allow "Install from this source" if prompted, and if Play Protect shows a scan/unknown-app notice, tap "More details → Install anyway".'],
              ['Is Swara safe to install?', 'Yes. Swara is 100% open source (GPL-3.0) with no ads, no trackers, and HTTPS-only network rules. You can inspect all source code on GitHub.'],
              ['How do I import Spotify or YouTube Music playlists?', 'Open Library → Import, paste any public Spotify or YouTube Music playlist link, and Swara will convert it automatically.'],
              ['How do I update to the latest version?', 'Swara checks for new GitHub releases automatically on startup, or you can tap Settings → About Swara → Check for updates.'],
            ].map(([q, a], idx) => {
              const isOpen = openFaq === idx;
              return h('div', { key: q, className: 'rounded-2xl bg-white/[0.03] border border-white/10 overflow-hidden' }, [
                h('button', {
                  type: 'button',
                  onClick: () => setOpenFaq(isOpen ? -1 : idx),
                  className: 'w-full px-5 py-4 flex items-center justify-between gap-4 text-left hover:bg-white/[0.03] transition cursor-pointer',
                }, [
                  h('span', { className: 'font-semibold text-sm text-[#93C5FD]' }, q),
                  h('span', { className: 'text-white/60 text-base leading-none shrink-0' }, isOpen ? '−' : '+'),
                ]),
                isOpen && h('div', { className: 'px-5 pb-4 text-xs sm:text-sm text-white/70 leading-relaxed border-t border-white/5 pt-3' }, a),
              ]);
            })),
          ]),

          h('footer', { key: 'foot', className: 'text-center px-4 py-6 text-xs text-white/45' }, 'swaramusic/Swara • Open Source under GPL-3.0'),

          showSupport &&
            h(
              'div',
              { key: 'supportModal', onClick: () => { setShowSupport(false); setSelectedSupporter(null); }, className: 'fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4' },
              h(
                'div',
                { onClick: (e) => e.stopPropagation(), className: 'bg-[#121826] border border-white/15 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl' },
                selectedSupporter
                  ? [
                      h('div', { key: 'hdr', className: 'flex items-center justify-between gap-2' }, [
                        h('button', { type: 'button', onClick: () => setSelectedSupporter(null), className: 'text-xs text-[#93C5FD] hover:text-white cursor-pointer' }, '← Back'),
                        h('h2', { className: 'font-bold text-base text-white truncate' }, `Support ${selectedSupporter.name}`),
                        h('span', { className: 'w-10' }),
                      ]),
                      h('div', { key: 'qr', className: 'bg-white rounded-2xl p-3 mx-auto w-52 h-52 sm:w-56 sm:h-56 flex items-center justify-center' }, [
                        h('img', { src: selectedSupporter.qr, alt: `Support ${selectedSupporter.name}`, className: 'w-full h-full object-contain' }),
                      ]),
                      h('p', { key: 'hint', className: 'text-xs text-white/60 text-center' }, 'Scan with any QRIS-compatible e-wallet or banking app worldwide'),
                      h('button', { key: 'close', onClick: () => { setShowSupport(false); setSelectedSupporter(null); }, className: 'w-full py-2.5 rounded-full bg-white/10 hover:bg-white/15 text-xs font-semibold text-white/80 cursor-pointer transition' }, 'Close'),
                    ]
                  : [
                      h('div', { key: 'hdr', className: 'flex items-center justify-between' }, [
                        h('div', null, [
                          h('h2', { className: 'font-bold text-lg text-white' }, 'Support Team'),
                          h('p', { className: 'text-xs text-white/55' }, 'Select a developer or collaborator to support'),
                        ]),
                        h('button', { type: 'button', onClick: () => setShowSupport(false), className: 'w-8 h-8 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-white/60 hover:text-white cursor-pointer transition' }, '✕'),
                      ]),
                      h('div', { key: 'list', className: 'space-y-2.5' }, CONTRIBUTORS.map((person) =>
                        h('div', {
                          key: person.id,
                          onClick: () => setSelectedSupporter(person),
                          className: 'flex items-center gap-3 p-3 rounded-2xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/10 cursor-pointer transition',
                        }, [
                          h('img', { src: person.avatar, alt: person.name, className: 'w-11 h-11 rounded-full object-cover bg-white/10 shrink-0' }),
                          h('div', { className: 'flex-1 min-w-0' }, [
                            h('p', { className: 'font-bold text-sm text-white truncate' }, person.name),
                            h('p', { className: 'text-xs text-white/60 truncate' }, person.role),
                          ]),
                          h('span', { className: 'px-3 py-1.5 rounded-full bg-[#2563EB]/20 text-[#93C5FD] text-xs font-semibold shrink-0' }, 'Support'),
                        ])
                      )),
                    ]
              )
            ),

          showSuggestions &&
            h(
              'div',
              { key: 'fbModal', onClick: () => setShowSuggestions(false), className: 'fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4' },
              h(
                'form',
                {
                  onSubmit: submitSuggestion,
                  onClick: (e) => e.stopPropagation(),
                  className: 'bg-[#121826] border border-white/15 rounded-3xl p-5 sm:p-6 max-w-md w-full max-h-[90dvh] overflow-y-auto space-y-4 shadow-2xl',
                },
                [
                  h('div', { className: 'flex items-start justify-between gap-3' }, [
                    h('div', { className: 'space-y-1' }, [
                      h('h2', { className: 'font-bold text-lg text-white' }, 'Suggestions'),
                      h('p', { className: 'text-xs text-white/55' }, 'Share ideas to help make Swara faster and better.'),
                    ]),
                    h('button', {
                      type: 'button',
                      onClick: () => setShowSuggestions(false),
                      className: 'w-8 h-8 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-white/60 hover:text-white cursor-pointer transition',
                    }, '✕'),
                  ]),

                  h('div', { className: 'space-y-1.5' }, [
                    h('label', { className: 'block text-xs font-medium text-white/70' }, 'Name / Handle (Optional)'),
                    h('input', {
                      type: 'text',
                      maxLength: 80,
                      value: fbContact,
                      onChange: (e) => setFbContact(e.target.value),
                      placeholder: 'e.g. Alex / @username',
                      className: 'w-full px-3.5 py-2.5 rounded-xl bg-black/35 border border-white/15 text-sm text-white placeholder:text-white/35 outline-none focus:border-[#2563EB] focus:ring-2 focus:ring-[#2563EB]/25 transition',
                    }),
                  ]),

                  h('div', { className: 'space-y-1.5' }, [
                    h('label', { className: 'block text-xs font-medium text-white/70' }, 'Your Suggestion'),
                    h('textarea', {
                      rows: 4,
                      maxLength: 1500,
                      required: true,
                      value: fbMsg,
                      onChange: (e) => setFbMsg(e.target.value),
                      placeholder: 'Write your feature idea or improvement...',
                      className: 'w-full px-3.5 py-2.5 rounded-xl bg-black/35 border border-white/15 text-sm text-white placeholder:text-white/35 outline-none focus:border-[#2563EB] focus:ring-2 focus:ring-[#2563EB]/25 transition resize-none',
                    }),
                  ]),

                  fbStatus.text && h('div', {
                    className: `px-3.5 py-2.5 rounded-xl text-xs border ${
                      fbStatus.type === 'success'
                        ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                        : fbStatus.type === 'error'
                        ? 'bg-rose-500/15 border-rose-500/30 text-rose-300'
                        : 'bg-[#2563EB]/15 border-[#2563EB]/30 text-[#93C5FD]'
                    }`,
                  }, fbStatus.text),

                  h('div', { className: 'flex items-center justify-end gap-2.5 pt-1' }, [
                    h('button', { type: 'button', onClick: () => setShowSuggestions(false), className: 'px-4 py-2.5 rounded-full text-xs font-medium text-white/65 hover:text-white hover:bg-white/5 cursor-pointer transition' }, 'Cancel'),
                    h('button', { type: 'submit', disabled: sending, className: 'px-6 py-2.5 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] disabled:opacity-50 text-xs font-bold text-white cursor-pointer transition shadow-lg shadow-[#2563EB]/25' }, sending ? 'Sending...' : 'Submit'),
                  ]),
                ]
              )
            ),
        ]
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
