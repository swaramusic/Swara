[package]
name = "swara-desktop"
version = "0.1.0"
edition = "2021"
description = "Swara Tauri v2 desktop host with native audio, metadata scanner, Discord RPC, and tray"

[lib]
name = "swara_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
base64 = "0.22"
discord-rich-presence = "0.2"
ureq = "2"
